<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORVGROUP AI Agent</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: #0b1020;
            color: #f4f6fc;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            padding: 40px 16px;
        }
        .app { width: 100%; max-width: 850px; }
        header { margin-bottom: 28px; }
        h1 { margin-bottom: 8px; }
        .muted { color: #9ba7bd; }
        .panel {
            background: #151d31;
            border: 1px solid #293650;
            border-radius: 14px;
            padding: 22px;
            margin-bottom: 20px;
        }
        input, textarea {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border-radius: 9px;
            border: 1px solid #394762;
            background: #0d1528;
            color: white;
            font: inherit;
        }
        textarea { min-height: 130px; resize: vertical; }
        button {
            margin-top: 14px;
            padding: 12px 22px;
            border: 0;
            border-radius: 8px;
            background: #5578f5;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        button:disabled { opacity: .5; cursor: wait; }
        .logout { background: #394762; float: right; }
        pre {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            color: #dce5f8;
            line-height: 1.6;
        }
        .hidden { display: none; }
    </style>
</head>
<body>
<main class="app">
    <header>
        <h1>ORVGROUP AI Agent</h1>
        <p class="muted">Your AI-powered task assistant</p>
    </header>

    <section class="panel" id="login-panel">
        <h2>Admin Login</h2>
        <form id="login-form">
            <input id="username" type="text"
                placeholder="Username" maxlength="100" required>
            <input id="password" type="password"
                placeholder="Password" maxlength="200" required>
            <button id="login-button" type="submit">Login</button>
        </form>
        <p id="login-status" class="muted"></p>
    </section>

    <section id="agent-panel" class="hidden">
        <section class="panel">
            <button id="logout-button" class="logout">Logout</button>
            <h2>What would you like me to do?</h2>
            <form id="chat-form">
                <textarea id="prompt" maxlength="4000"
                    placeholder="Describe your task..." required></textarea>
                <button id="send-button" type="submit">Run Agent</button>
            </form>
            <p id="status" class="muted">Ready</p>
        </section>

        <section class="panel">
            <h2>Agent Response</h2>
            <pre id="output">Your result will appear here.</pre>
        </section>
    </section>
</main>

<script>
const loginPanel = document.getElementById("login-panel");
const agentPanel = document.getElementById("agent-panel");
const loginForm = document.getElementById("login-form");
const loginStatus = document.getElementById("login-status");

loginForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    const button = document.getElementById("login-button");
    button.disabled = true;
    loginStatus.textContent = "Signing in...";

    try {
        const response = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                username: document.getElementById("username").value,
                password: document.getElementById("password").value
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.detail || "Login failed.");
        }

        loginPanel.classList.add("hidden");
        agentPanel.classList.remove("hidden");
        loginForm.reset();
    } catch (error) {
        loginStatus.textContent = error.message;
    } finally {
        button.disabled = false;
    }
});

document.getElementById("logout-button").addEventListener("click", async () => {
    await fetch("/api/logout", { method: "POST" });
    agentPanel.classList.add("hidden");
    loginPanel.classList.remove("hidden");
    loginStatus.textContent = "You have logged out.";
});

document.getElementById("chat-form").addEventListener("submit", async (event) => {
    event.preventDefault();

    const prompt = document.getElementById("prompt").value.trim();
    if (!prompt) return;

    const button = document.getElementById("send-button");
    const status = document.getElementById("status");
    const output = document.getElementById("output");

    button.disabled = true;
    status.textContent = "Agent is processing...";
    output.textContent = "";

    try {
        const response = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt })
        });

        const data = await response.json();

        if (response.status === 401) {
            agentPanel.classList.add("hidden");
            loginPanel.classList.remove("hidden");
            throw new Error("Session expired. Please log in again.");
        }

        if (!response.ok) {
            throw new Error(data.detail || "Request failed.");
        }

        output.textContent = JSON.stringify(data, null, 2);
        status.textContent = "Request completed.";
    } catch (error) {
        output.textContent = error.message;
        status.textContent = "Request failed.";
    } finally {
        button.disabled = false;
    }
});
</script>
</body>
</html>
